        - heading "Hail damage? We make the insurance claim simple — and by the book." [level=2] [ref=e115]
        - paragraph [ref=e116]: "A storm claim is where homeowners get burned by fly-by-night roofers. Here's how we do it differently: no waiving your deductible, no posing as your adjuster — just an honest claim and a roof done right."
