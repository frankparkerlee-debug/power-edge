          - paragraph [ref=f1e94]: No manufactured damage, no scare inspections. If there's nothing worth claiming, you'll hear exactly that — in writing.
        - generic [ref=f1e99]:
          - heading "We never touch your deductible" [level=3] [ref=f1e100]
          - paragraph [ref=f1e101]: Waiving or "eating" deductibles is a crime in Texas. Any roofer who offers is breaking the law with your name on the contract.
