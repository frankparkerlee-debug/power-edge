<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PowerEdge appointment card</title>
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_print.css">
<style>
/*
 * Appointment card. Standard business card: trim 3.5 x 2 in, 0.125 in bleed,
 * so each page is 3.75 x 2.25 in. Safe area 0.125 in inside trim.
 *
 * The setter fills in the paper side at the door once the inspection is
 * booked in the app, which also emails the homeowner a confirmation with a
 * link to change it. Uncoated or matte stock, so a pen writes on it.
 */
@page { size: 3.75in 2.25in; margin: 0; }
.page { width: 3.75in; height: 2.25in; }
.trim { left: .125in; top: .125in; width: 3.5in; height: 2in; }
.safe { left: .25in; top: .25in; width: 3.25in; height: 1.75in; }

:root { --paper: #f4f4f1; --mist: #ced5dd; --ink-gray: #6f7782; }
.head { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; }

/* ---- Front: what the setter writes ---- */
.front { background: var(--paper); color: var(--ink); }
.front .wrap { position: absolute; left: .29in; right: .29in; top: .27in; bottom: .25in; display: flex; flex-direction: column; }
.front .top { display: flex; justify-content: space-between; align-items: center; }
.front .top img { width: .9in; display: block; }
.front .top span { font-size: 6.2pt; font-weight: 600; color: var(--muted); }
.fields { margin-top: .06in; }
.row { display: flex; gap: .14in; margin-top: .05in; }
.field { flex: 1; display: flex; flex-direction: column; }
.field i { height: .25in; border-bottom: .6pt solid #b4b9bf; }
.field span { margin-top: .025in; font-size: 5.6pt; color: var(--muted); }
.field.short { flex: 0 0 1.12in; }
.front .note { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 6.2pt; color: var(--muted); }
.front .note b { font-family: "Archivo", sans-serif; font-size: 8.4pt; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; }

/* ---- Back: the promise ---- */
.back { background: var(--ink); color: var(--white); }
.back .wrap { position: absolute; left: .29in; right: .29in; top: .29in; bottom: .27in; display: flex; flex-direction: column; }
.back .bolt { width: .32in; height: 1.6pt; background: var(--lime); }
.back h2 { margin-top: .13in; font-size: 15.5pt; }
.back h2 .lead { display: block; color: var(--ink-gray); }
.back .end { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
.back .end p { font-size: 6pt; line-height: 1.4; color: var(--mist); }
.back .tel small { display: block; font-size: 5.8pt; color: var(--ink-gray); text-align: right; }
.back .tel b { display: block; font-family: "Archivo", sans-serif; font-size: 13pt; font-weight: 600; letter-spacing: -0.01em; color: var(--lime); line-height: 1.05; }
</style>
</head>
<body>

<section class="page front">
  <div class="trim"></div><div class="safe"></div>
  <div class="wrap">
    <div class="top">
      <img src="../logos/lockup-on-light.png" alt="PowerEdge">
      <span>Your free roof inspection</span>
    </div>
    <div class="fields">
      <div class="row">
        <div class="field"><i></i><span>Day</span></div>
        <div class="field short"><i></i><span>Arrival window</span></div>
      </div>
      <div class="row">
        <div class="field"><i></i><span>Your inspector</span></div>
        <div class="field short"><i></i><span>Booked by</span></div>
      </div>
    </div>
    <div class="note"><span>We call before we head over.</span><b>469-277-9594</b></div>
  </div>
</section>

<section class="page back">
  <div class="trim"></div><div class="safe"></div>
  <div class="wrap">
    <div class="bolt"></div>
    <h2 class="head"><span class="lead">Still answering</span>after the check clears.</h2>
    <div class="end">
      <p>Need to change your time? Call or text,<br>or use the link in your confirmation email.</p>
      <div class="tel"><small>Call or text</small><b>469-277-9594</b></div>
    </div>
  </div>
</section>

</body>
</html>
